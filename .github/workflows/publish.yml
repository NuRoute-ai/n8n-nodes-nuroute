name: Publish to npm

# Runs only on a version tag (e.g. `v1.0.1`), pushed once the corresponding
# package.json version has already been committed. npm provenance requires the
# publish to happen from a GitHub Actions run via OIDC — a publish from a
# laptop, which is how earlier versions of this package were published,
# can never carry a provenance attestation.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # required so npm can mint a provenance attestation via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts: n8n-workflow pulls in isolated-vm transitively (used only for n8n's
      # own sandboxed code-execution feature at runtime); its native addon build is broken on
      # newer toolchains and unnecessary here since we only need n8n-workflow for its
      # TypeScript types, never its runtime — same reasoning already applied for this same
      # dependency in the main monorepo's pnpm config.
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
